services:
  glm-panel:
    image: ghcr.io/countossbot/glm-panel:latest
    container_name: glm-panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GLM_PROJECT_ROOT: /app/frontend
      GLM_BRIDGE_URL: http://127.0.0.1:3001
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-headless-shell
      ALIYUN_CAPTCHA_ACCESS_KEY: ${ALIYUN_CAPTCHA_ACCESS_KEY:-}
      ALIYUN_CAPTCHA_SECRET: ${ALIYUN_CAPTCHA_SECRET:-}
      TARGET: ${TARGET:-150}
      REFILL_BELOW: ${REFILL_BELOW:-100}
      CHECK_EVERY: ${CHECK_EVERY:-120}
    volumes:
      - glm-runtime:/app/runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null && curl -fsS http://127.0.0.1:3001/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  glm-runtime:
